<div
  class="flex flex-col gap-6 rounded-3xl bg-neutral-950 p-6 shadow-2xl ring-1 ring-white/10 lg:flex-row lg:items-start"
>
  <div class="min-w-0 flex-1">
    <h2 class="mb-4 text-xs font-semibold uppercase tracking-[0.2em] text-neutral-400">Floor Plan</h2>

    <svg
      class="h-auto w-full rounded-2xl bg-neutral-900 ring-1 ring-white/5"
      viewBox="0 0 800 600"
      preserveAspectRatio="xMidYMid meet"
    >
      <defs>
        <pattern id="floor-grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" class="fill-none stroke-white/5" stroke-width="1"></path>
        </pattern>
      </defs>

      <!-- Floor -->
      <rect x="40" y="40" width="720" height="500" fill="url(#floor-grid)"></rect>

      <!-- Walls -->
      <g class="stroke-neutral-300" stroke-width="4" stroke-linecap="round">
        <line x1="40" y1="40" x2="375" y2="40"></line>
        <line x1="435" y1="40" x2="760" y2="40"></line>
        <line x1="760" y1="40" x2="760" y2="540"></line>
        <line x1="760" y1="540" x2="40" y2="540"></line>
        <line x1="40" y1="540" x2="40" y2="40"></line>
      </g>

      <!-- Partition between the booth/middle column and the right-hand tables -->
      <line
        x1="503"
        y1="40"
        x2="503"
        y2="500"
        class="stroke-neutral-300/60"
        stroke-width="3"
        stroke-linecap="round"
      ></line>

      <!-- Door -->
      <g class="stroke-sky-400/70">
        <path
          d="M375,100 A60,60 0 0 1 435,40"
          class="fill-none"
          stroke-width="1.5"
          stroke-dasharray="4 4"
        ></path>
        <line x1="375" y1="40" x2="375" y2="100" stroke-width="3"></line>
      </g>
      <text
        x="405"
        y="28"
        text-anchor="middle"
        class="fill-neutral-500 text-[11px] font-semibold uppercase tracking-widest"
      >
        Door
      </text>

      <!-- Bar -->
      <rect
        x="80"
        y="508"
        width="275"
        height="18"
        rx="6"
        class="fill-amber-900/60 stroke-amber-600/60"
        stroke-width="1"
      ></rect>
      <text x="80" y="500" class="fill-neutral-500 text-[11px] font-semibold uppercase tracking-widest">
        Bar
      </text>

      <!-- Tables -->
      @for (table of tables(); track table.id) {
        <g
          (click)="selectTable(table)"
          class="origin-center cursor-pointer transition-transform duration-150 [transform-box:fill-box] hover:scale-110"
          [class.opacity-50]="table.status === 'blocked'"
          [class.pointer-events-none]="table.status === 'blocked'"
        >
          @if (table.shape === 'circle') {
            <circle
              [attr.cx]="table.x"
              [attr.cy]="table.y"
              [attr.r]="table.r"
              [attr.fill]="getFill(table.status)"
              [attr.stroke]="selectedTable()?.id === table.id ? '#38bdf8' : '#0a0a0a'"
              [attr.stroke-width]="selectedTable()?.id === table.id ? 3 : 2"
            ></circle>
          }

          @if (table.shape === 'rect') {
            <rect
              [attr.x]="table.x"
              [attr.y]="table.y"
              [attr.width]="table.width"
              [attr.height]="table.height"
              rx="8"
              ry="8"
              [attr.fill]="getFill(table.status)"
              [attr.stroke]="selectedTable()?.id === table.id ? '#38bdf8' : '#0a0a0a'"
              [attr.stroke-width]="selectedTable()?.id === table.id ? 3 : 2"
            ></rect>
          }

          <text
            [attr.x]="table.x"
            [attr.y]="table.y + 5"
            text-anchor="middle"
            class="fill-white text-[12px] font-semibold"
            pointer-events="none"
          >
            {{ table.label }}
          </text>
        </g>
      }
    </svg>

    <!-- Legend -->
    <div class="mt-4 flex flex-wrap gap-4 text-xs text-neutral-400">
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-emerald-500"></span>
        Available
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-amber-500"></span>
        Reserved
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-red-500"></span>
        Occupied
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-gray-500"></span>
        Blocked
      </span>
    </div>
  </div>

  @if (selectedTable(); as table) {
    <div class="w-full shrink-0 rounded-2xl bg-neutral-900 p-5 shadow-xl ring-1 ring-white/10 lg:w-72">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-white">Table {{ table.label }}</h3>
        <span
          class="rounded-full px-2.5 py-0.5 text-xs font-medium capitalize"
          [class.bg-emerald-500/15]="table.status === 'available'"
          [class.text-emerald-400]="table.status === 'available'"
          [class.bg-amber-500/15]="table.status === 'reserved'"
          [class.text-amber-400]="table.status === 'reserved'"
          [class.bg-red-500/15]="table.status === 'occupied'"
          [class.text-red-400]="table.status === 'occupied'"
          [class.bg-gray-500/15]="table.status === 'blocked'"
          [class.text-gray-400]="table.status === 'blocked'"
        >
          {{ table.status }}
        </span>
      </div>
      <p class="mt-1 text-sm text-neutral-400">Seats {{ table.capacity }}</p>

      <div class="mt-5 flex flex-col gap-2">
        <button
          type="button"
          (click)="reserveSelectedTable()"
          class="rounded-lg bg-amber-500 px-4 py-2 text-sm font-medium text-neutral-950 transition hover:bg-amber-400"
        >
          Reserve
        </button>
        <button
          type="button"
          (click)="markOccupied(table.id)"
          class="rounded-lg bg-red-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-400"
        >
          Mark Occupied
        </button>
        <button
          type="button"
          (click)="closeModal()"
          class="rounded-lg bg-neutral-800 px-4 py-2 text-sm font-medium text-neutral-300 transition hover:bg-neutral-700"
        >
          Close
        </button>
      </div>
    </div>
  }
</div>
